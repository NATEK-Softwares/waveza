{% extends 'base.html' %}
{% block title %}Edit Poem{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Edit Poem</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('edit_poem', poem_id=poem.id) }}">
                        <div class="form-group mb-3">
                            <label for="title">Title</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ poem.title }}" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="category">Category</label>
                            <select class="form-control" id="category" name="category">
                                <option value="romance" {% if poem.category=='romance' %}selected{% endif %}>Romance</option>
                                <option value="anxiety" {% if poem.category=='anxiety' %}selected{% endif %}>Anxiety</option>
                                <option value="self-introspection" {% if poem.category=='self-introspection' %}selected{% endif %}>Self-Introspection</option>
                                <option value="depression" {% if poem.category=='depression' %}selected{% endif %}>Depression</option>
                                <option value=""></option>
                                <input type="text" name="new category" class="form-control" id="new-category" placeholder="New Category">

                            </select>
                        </div>

                        <div class="form-group mb-3">
                            <label for="thumbnail">Thumbnail Image</label>
                            <input type="file" class="form-control" id="thumbnail" name="thumbnail" accept="image/png, image/jpeg, image/jpg, image/webp, image/avif" value="{{ poem.thumbnail }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="video">Art Media Content</label>
                            <input type="file" name="video" class="form-control" id="video" accept="video/*,audio/*" placeholder="Upload video or audio">
                        </div>

                        <div class="form-group mb-3">
                            <label for="content">Poem</label>
                            <div class="form-group mb-3">
                                <!-- <label for="content">Poem</label> -->
                                <!-- <div id="editor" style="height: 300px;">{{ poem.content|safe }}</div> -->
                                 {% if poem.content %}
                                    <textarea name="content" id="content" style="height: 300px; width: 100%" required>{{ poem.content }}</textarea>
                                {% endif %}
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['blockquote', 'code-block'],
                ['link', 'image']  // enable image upload button
            ]
        }
    });

    // Handle image uploads
    function uploadImage(file) {
        let formData = new FormData();
        formData.append("image", file);

        fetch("{{ url_for('upload_image') }}", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(result => {
            if (result.url) {
                let range = quill.getSelection();
                quill.insertEmbed(range.index, 'image', result.url);
            } else {
                alert("Upload failed: " + result.error);
            }
        })
        .catch(err => {
            console.error("Error uploading image:", err);
        });
    }

    quill.getModule("toolbar").addHandler("image", () => {
        let input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = () => {
            let file = input.files[0];
            if (file) {
                uploadImage(file);
            }
        };
        input.click();
    });

    // Submit: copy Quill content into hidden textarea
    document.querySelector("form").onsubmit = function() {
        document.querySelector("#content").value = quill.root.innerHTML;
    };
</script>

{% endblock %}
