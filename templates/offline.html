<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - WaveZA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .offline-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        h1 {
            color: #1a1a2e;
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .offline-description {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .offline-features {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }
        
        .feature:last-child {
            margin-bottom: 0;
        }
        
        .feature-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            border: 2px solid #667eea;
            color: #667eea;
            background: transparent;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: #ff6b6b;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff6b6b;
            border-radius: 50%;
            animation: blink 2s infinite;
        }
        
        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        
        @media (max-width: 600px) {
            .offline-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .offline-icon {
                font-size: 60px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        
        <p class="offline-description">
            It looks like you've lost your internet connection. Don't worry, you can still access previously viewed content while offline.
        </p>
        
        <div class="offline-features">
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Read previously loaded poems</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Browse saved categories</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Access your profile</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Changes sync when online</span>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="btn-primary" onclick="window.location.href='/'">
                Return Home
            </button>
            <button class="btn-secondary" onclick="location.reload()">
                Try Again
            </button>
        </div>
        
        <div class="status-indicator">
            <span class="dot"></span>
            <span>Waiting for connection...</span>
        </div>
    </div>
    
    <script>
        // Listen for connection restoration
        window.addEventListener('online', function() {
            // Reload or update UI when back online
            window.location.href = '/';
        });
    </script>
</body>
</html>
