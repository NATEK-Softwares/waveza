{% extends 'base.html' %}
{% block title %}Add Poem{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Add New Poem</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('add_poem') }}">
                        <div class="form-group mb-3">
                            <label for="title">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="category">Category</label>
                            <select class="form-control" id="category" name="category">
                                <option value="romance">Romance</option>
                                <option value="anxiety">Anxiety</option>
                                <option value="self-introspection">Self-Introspection</option>
                                <option value="black-conciousness">Black Conciousness</option>
                                <option value="democracy">Democracy</option>
                                <option value="depression">Depression</option>
                                <option value=""></option>
                                <input type="text" name="new category" class="form-control" id="new-category" placeholder="New Category">
                            </select>
                        </div>

                        <div class="form-group mb-3">
                            <label for="thumbnail">Thumbnail URL (optional)</label>
                            <input type="text" class="form-control" id="thumbnail" name="thumbnail" placeholder="/static/img/your-image.jpg">
                        </div>

                        <div class="form-group mb-3">
                            <label for="content">Poem</label>
                            <div class="form-group mb-3">
                                <textarea name="content" id="content" style="height: 300px; width: 100%" placeholder="Poem goes here" required></textarea>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-success w-100">Publish Poem</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['blockquote', 'code-block'],
                ['link', 'image']  // enable image upload button
            ]
        }
    });

    // Handle image uploads
    function uploadImage(file) {
        let formData = new FormData();
        formData.append("image", file);

        fetch("{{ url_for('upload_image') }}", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(result => {
            if (result.url) {
                let range = quill.getSelection();
                quill.insertEmbed(range.index, 'image', result.url);
            } else {
                alert("Upload failed: " + result.error);
            }
        })
        .catch(err => {
            console.error("Error uploading image:", err);
        });
    }

    quill.getModule("toolbar").addHandler("image", () => {
        let input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = () => {
            let file = input.files[0];
            if (file) {
                uploadImage(file);
            }
        };
        input.click();
    });

    // Submit: copy Quill content into hidden textarea
    document.querySelector("form").onsubmit = function() {
        document.querySelector("#content").value = quill.root.innerHTML;
    };
</script>

{% endblock %}
